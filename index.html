<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Deluge Patch Book</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Original 2x2 pad-grid icon (own design, not Synthstrom's logo) in this
     app's own gold/cyan accent colors, matching delugecommunity.com's real
     hardware-icon palette that styles.css's own --gold/--cyan already use --
     inline SVG data URI instead of a separate file to keep this a single-
     file-per-concern static app. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317181a'/%3E%3Crect x='6' y='6' width='9' height='9' rx='2' fill='%23e2ad5d'/%3E%3Crect x='17' y='6' width='9' height='9' rx='2' fill='%2300ffca'/%3E%3Crect x='6' y='17' width='9' height='9' rx='2' fill='%2300ffca'/%3E%3Crect x='17' y='17' width='9' height='9' rx='2' fill='%23e2ad5d'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <h1>Deluge Patch Book</h1>
  <div class="topbar-controls">
    <!-- Left-to-right: how often each group gets touched, most to least --
         Beginner/Expert affects every step you're actively reading, the
         Deluge cluster is a once-per-session action (grouped together
         since Connect/status/Monitor are all one concern), User Guide is
         reference material used rarely and set apart with its own left
         border instead of blending into the functional button row. -->
    <label class="mode-toggle">
      <span class="mode-label">Beginner</span>
      <input type="checkbox" id="modeToggle" />
      <span class="slider"></span>
      <span class="mode-label">Expert</span>
    </label>
    <div class="deluge-connect">
      <button id="delugeConnectBtn" class="btn-secondary">Connect Deluge&hellip;</button>
      <span id="delugeStatus" class="deluge-status">not connected</span>
      <button id="midiMonitorBtn" class="btn-link" title="See every raw MIDI message arriving from the Deluge -- useful for checking whether MIDI Follow feedback is actually reaching the browser">MIDI Monitor&hellip;</button>
    </div>
    <div class="topbar-help">
      <button id="userGuideBtn" class="btn-link">User Guide&hellip;</button>
    </div>
  </div>
</header>

<main class="layout">
  <aside class="library">
    <button type="button" class="library-collapse-toggle" id="libraryCollapseToggle" aria-expanded="true" aria-controls="loaderPanel libraryBody" title="Collapse the preset list to give the guide more room">
      <span class="library-collapse-icon">&#8249;</span>
      <span class="library-collapse-label">Presets</span>
    </button>
    <div class="loader" id="loaderPanel">
      <button id="pickFolderBtn" class="btn-primary">Choose synths folder&hellip;</button>
      <input type="file" id="folderInput" webkitdirectory multiple style="display:none" />
      <!-- Not a visible picker anymore (see the User Guide button's
           handling and app.js's ingestFiles() comment for why) -- kept as
           a hidden input purely as a headless single-file load path the
           test suite still relies on. -->
      <input type="file" id="filesInput" multiple accept=".xml,.XML" style="display:none" />
      <p class="or-divider">or</p>
      <button id="loadFromDelugeBtn" class="btn-secondary">Load a preset from connected Deluge&hellip;</button>
      <p id="loadStatus" class="load-status"></p>
    </div>

    <div class="library-body" id="libraryBody" hidden>
      <input type="search" id="searchBox" placeholder="Search presets or packs&hellip;" />
      <div class="library-filters" id="libraryFilters">
        <div class="filter-group" role="group" aria-label="Filter by engine">
          <button type="button" class="filter-chip" data-group="engine" data-value="all">All engines</button>
          <button type="button" class="filter-chip" data-group="engine" data-value="subtractive">Subtractive</button>
          <button type="button" class="filter-chip" data-group="engine" data-value="fm">FM</button>
          <button type="button" class="filter-chip" data-group="engine" data-value="ringmod">Ring Mod</button>
        </div>
        <div class="filter-group" role="group" aria-label="Filter by oscillator source">
          <button type="button" class="filter-chip" data-group="oscSource" data-value="all">Any osc</button>
          <button type="button" class="filter-chip" data-group="oscSource" data-value="waveform">Waveform</button>
          <button type="button" class="filter-chip" data-group="oscSource" data-value="sample">Sample</button>
          <button type="button" class="filter-chip" data-group="oscSource" data-value="multisample">Multisample</button>
        </div>
        <div class="filter-group" role="group" aria-label="Filter by other features">
          <button type="button" class="filter-chip" data-group="flags" data-value="hasArp">Arp</button>
          <button type="button" class="filter-chip" data-group="flags" data-value="hasUnison">Unison</button>
          <button type="button" class="filter-chip" data-group="flags" data-value="hasCables">Custom cables</button>
          <button type="button" class="filter-chip" data-group="flags" data-value="hasSidechain">Sidechain</button>
        </div>
      </div>
      <div class="preset-count" id="presetCount"></div>
      <div id="presetTree" class="preset-tree"></div>
    </div>
  </aside>

  <section class="guide" id="guidePanel">
    <div class="guide-empty" id="guideEmpty">
      <p>Load a preset folder, then pick a preset to see its step-by-step build guide.</p>
    </div>
    <div class="guide-content" id="guideContent" hidden>
      <div class="guide-header">
        <div>
          <div class="guide-pack" id="guidePack"></div>
          <h2 id="guideTitle"></h2>
        </div>
        <div class="guide-progress">
          <span id="progressText"></span>
          <button id="resetProgressBtn" class="btn-link">Reset progress</button>
        </div>
      </div>
      <div class="guide-actions">
        <button id="glossaryBtn" class="btn-secondary">Glossary</button>
        <button id="printBtn" class="btn-secondary">Print / export cheat sheet</button>
      </div>
      <div class="tab-bar" id="tabBar">
        <button class="tab-btn active" data-tab="steps">Steps</button>
        <button class="tab-btn" data-tab="matrix">Mod Matrix</button>
        <button class="tab-btn" data-tab="signal">Signal Path</button>
        <button class="tab-btn" data-tab="compare">Compare</button>
      </div>
      <div class="tab-panel active" id="tabSteps">
        <div class="guide-toolbar" id="guideToolbar">
          <label class="mini-toggle" title="Show which manual section or community-firmware doc backs each step">
            <input type="checkbox" id="refsToggle" />
            <span class="mini-slider"></span>
            <span>Show manual reference</span>
          </label>
          <label class="mini-toggle" title="Show a short 'why this matters' (and sometimes 'try this') line under select steps">
            <input type="checkbox" id="tipsToggle" />
            <span class="mini-slider"></span>
            <span>Show tips</span>
          </label>
        </div>
        <div class="device-check-panel" id="deviceCheckPanel">
          <div class="device-check-info">
            <p class="device-check-desc">
              <strong>Check your progress on the Deluge:</strong> save your patch to the SD
              card, then <strong>Check now</strong>
              <span id="midiFollowHint" hidden>(or just turn a knob for steps tagged
              <span class="step-badge step-badge-live">live</span>)</span>
              &mdash; full details in the <button type="button" class="btn-link" id="userGuideLinkCheck">User Guide</button>.
            </p>
          </div>
          <div class="device-check-actions">
            <button id="checkOnDeviceBtn" class="btn-primary btn-check">Check now&hellip;</button>
            <button id="checkSettingsBtn" class="btn-link">Check settings&hellip;</button>
            <span id="deviceCheckStatus" class="device-check-status"></span>
          </div>
        </div>
        <div class="unexpected-changes" id="unexpectedChanges" hidden></div>
        <div id="guideSections"></div>
      </div>
      <div class="tab-panel" id="tabMatrix">
        <div id="modMatrixContent"></div>
      </div>
      <div class="tab-panel" id="tabSignal">
        <div id="signalPathContent"></div>
      </div>
      <div class="tab-panel" id="tabCompare">
        <div id="compareContent"></div>
      </div>
    </div>
  </section>
</main>

<div id="svgTooltip" class="svg-tooltip" hidden></div>
<div id="modalOverlay" class="modal-overlay" hidden></div>

<script src="modules/deluge-sysex.js"></script>
<script src="modules/deluge-check.js"></script>
<script src="modules/deluge-check-settings.js"></script>
<script src="modules/deluge-midi-follow.js"></script>
<script src="app.js"></script>
</body>
</html>
